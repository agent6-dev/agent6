name: pypi

# Publishes to PyPI via Trusted Publishing (OpenID Connect) on release.
# Reuses the amd64 + arm64 wheels + the sdist built by build.yml. No API
# tokens stored.
#
# One-time PyPI setup: configure a Trusted Publisher for the `agent6`
# project pointing at this repository + workflow + environment "pypi".

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/agent6
    permissions:
      id-token: write  # required for OIDC token exchange
    steps:
      - name: Download every arch's wheel + the sdist
        # build.yml uploads one artifact per arch (agent6-dist-amd64 /
        # agent6-dist-arm64); merge them into a single dist/ for upload.
        uses: actions/download-artifact@v8
        with:
          pattern: agent6-dist-*
          merge-multiple: true
          path: dist/

      - name: Sanity-check artifacts (both arch wheels + the sdist)
        run: |
          ls -la dist/
          test "$(ls dist/agent6-*.whl 2>/dev/null | wc -l)" -ge 2
          test -n "$(ls dist/agent6-*.tar.gz 2>/dev/null)"

      - name: Every artifact's version matches the release tag
        # Any published release starts this upload; without this, a tag
        # created off a commit whose __version__ says otherwise would ship
        # mismatched artifacts. The tag (vX.Y.Z) is the release's claim;
        # every wheel and the sdist must carry exactly X.Y.Z.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "release tag version: $tag"
          for f in dist/agent6-*.whl dist/agent6-*.tar.gz; do
            base=$(basename "$f")
            ver=$(echo "$base" | sed -E 's/^agent6-([0-9][^-]*)[-.].*$/\1/; s/\.tar$//')
            echo "$base -> $ver"
            test "$ver" = "$tag" || { echo "::error::$base version $ver != tag $tag"; exit 1; }
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # No password / token: Trusted Publishing exchanges the GitHub
          # OIDC token for a short-lived PyPI upload token.
