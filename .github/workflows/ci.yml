name: ci

# Lints and type-checks once, then tests the wheels produced by build.yml
# (agent6-jail bundled inside) on Python 3.13 to 3.15 on amd64 and arm64.
# This catches version- and architecture-specific failures.

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  lint:
    name: ruff + pyright + tach
    # Arch- and version-independent static checks: run once.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true

      - name: Sync dev environment
        run: uv sync --all-extras --dev

      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run tach check

  test:
    name: pytest (${{ matrix.platform.arch }}, py${{ matrix.python }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15"]
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv + Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Sync dev environment
        run: uv sync --all-extras --dev

      - name: Cache Playwright's Chromium (the `browser` tests)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright's Chromium
        run: uv run playwright install --with-deps chromium

      - name: Download the built wheel for this arch
        uses: actions/download-artifact@v8
        with:
          name: agent6-dist-${{ matrix.platform.arch }}
          path: dist/

      - name: Install the built wheel into the env
        # py3-none-<plat>: one wheel covers every supported interpreter, so the
        # same arch wheel is exercised on 3.13, 3.14 and 3.15.
        run: |
          wheel=$(ls dist/agent6-*.whl)
          uv pip install --reinstall "$wheel"

      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor)
        # The jail (and the session network it opens per run) creates user
        # namespaces, which the default 24.04 AppArmor policy blocks with
        # `uid_map: Operation not permitted` — same relaxation as the
        # sandbox-smoke job below.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: The suite imports the installed wheel, not the checkout
        # pytest's `pythonpath = ["src"]` serves local dev; here it would
        # shadow the artifact under test, so the run below overrides it and
        # this step proves the resolution.
        # --no-sync everywhere after the install: a bare `uv run` re-syncs
        # the project, silently swapping the artifact back for the checkout.
        run: |
          uv run --no-sync python -c "
          import agent6
          assert 'site-packages' in agent6.__file__, agent6.__file__
          print('testing', agent6.__file__)"

      - run: uv run --no-sync pytest -ra --override-ini=pythonpath=

  sandbox-smoke:
    name: agent6 check sandbox (${{ matrix.platform.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.1

      - name: Download the built wheel for this arch
        uses: actions/download-artifact@v8
        with:
          name: agent6-dist-${{ matrix.platform.arch }}
          path: dist/

      - name: Install the wheel as a CLI tool
        run: |
          wheel=$(ls dist/agent6-*.whl)
          uv tool install "$wheel"

      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor)
        # Since Ubuntu 23.10 the default AppArmor policy blocks unprivileged
        # userns creation, which makes agent6's `full` isolation fail
        # with `uid_map: Operation not permitted`. The GitHub Actions
        # ubuntu-24.04 images (amd64 + arm64) carry this; relax it so check
        # sandbox can exercise the `full` path the rest of the world will use.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: agent6 check sandbox
        run: agent6 check sandbox

  container-smoke:
    name: container isolation (amd64)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv + Python 3.13
        uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync dev environment
        run: uv sync --all-extras --dev

      - name: Download the built wheel
        uses: actions/download-artifact@v8
        with:
          name: agent6-dist-amd64
          path: dist/

      - name: Install the built wheel into the env
        run: |
          wheel=$(ls dist/agent6-*.whl)
          uv pip install --reinstall "$wheel"

      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build this repository's dev container and start it labelled as VS Code does
        # The runtime test attaches to the container that mounts this checkout, as a developer's
        # VS Code would have started it; the image's user takes the runner's uid and gid.
        run: |
          docker build -t agent6-devcontainer:ci -f .devcontainer/Dockerfile .devcontainer
          printf 'FROM agent6-devcontainer:ci\nUSER root\nRUN groupmod -g %s vscode && usermod -u %s -g %s vscode && chown -R %s:%s /home/vscode\nUSER vscode\n' \
            "$(id -g)" "$(id -u)" "$(id -g)" "$(id -u)" "$(id -g)" | docker build -t agent6-devcontainer:ci-uid -
          docker run -d --name agent6-ci \
            --label "devcontainer.local_folder=$PWD" \
            --label 'devcontainer.metadata=[{"remoteUser":"vscode"}]' \
            -v "$PWD:/workspaces/agent6" -w /workspaces/agent6 --user vscode \
            agent6-devcontainer:ci-uid sleep infinity

      - name: The container tests against the real container, none skipped
        env:
          AGENT6_CONTAINER_TEST_RUNTIME: '["docker"]'
        run: |
          set -o pipefail
          uv run --no-sync pytest -ra --override-ini=pythonpath= -n 0 \
            tests/sandbox/test_container_runtime.py tests/sandbox/test_container_transport.py \
            tests/sandbox/test_container_isolation.py | tee "$RUNNER_TEMP/container-tests.log"
          ! grep -q '^SKIPPED' "$RUNNER_TEMP/container-tests.log"

      - name: agent6 check sandbox under container isolation
        run: |
          printf '[sandbox]\nisolation = "container"\n' > /tmp/container.toml
          uv run --no-sync agent6 --config /tmp/container.toml check sandbox
