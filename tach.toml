[[modules]]
# review_gate and toolset use review_seat; review_seat uses review_panel and llm_json.
# review_gate and loop use review_history to restore durable panel evidence.
# compaction_driver and compaction_rules use compaction_elision and compaction_window.
# compaction_window uses loop_conversation and compaction_elision; the result cap
# reads review_panel and verify_gate notice sizes within this harness boundary.
# The package re-exports prompt_preview; it uses dag_focus, prompt_blocks,
# repo_context and toolset within this boundary.
path = "agent6.harness"
depends_on = [
  "agent6.budget",  # loop harness needs BudgetExceededError
  "agent6.config",
  "agent6.context.memory",  # cross-run memories injected into the system prompt
  # the agent's own scratchpad, injected beside them
  "agent6.context.skills",  # operator-installed skills indexed in the system prompt
  "agent6.directive",
  "agent6.errors",
  "agent6.evidence",
  "agent6.graph.curator",
  "agent6.graph.models",
  "agent6.graph.order",  # the one walk order the frontier and list_tasks share
  "agent6.kinds",
  "agent6.media",
  "agent6.paths",
  "agent6.portable",
  "agent6.prompts",  # pure prompt/template text the loop assembles
  "agent6.providers",
  "agent6.review_records",
  # prompt show resolves the isolation a run here would get, so the preview
  # renders the same level-aware blocks the loop does
  "agent6.sandbox",
  "agent6.sandbox.detect",
  "agent6.sessions.event_log",
  # the start-family emitter stamps worker.pid before the event is readable
  "agent6.sessions.ipc",
  # subrun lands a finished lane's session dir in the ORIGIN state dir; the
  # bucket layout has one owner rather than a second spelling here.
  "agent6.sessions.layout",
  "agent6.sessions.objects",
  "agent6.sessions.process",
  "agent6.task_text",  # the session.start headline is the operator's own words
  "agent6.terminal",  # a changed path's name printed on one line
  "agent6.tools",
  "agent6.tools.dispatch",
  "agent6.tools.schema",
  "agent6.tools.target_policy",
  "agent6.tools.verify_infer",  # gateless runs adopt a verify mid-run (deterministic tiers)
  "agent6.vcs.commit_message",
  "agent6.vcs.git_files",
  "agent6.vcs.git_ops",
  "agent6.vcs.git_read",
  "agent6.vcs.review",
  "agent6.vcs.review_rule_reader",
  "agent6.viewmodel",  # the run review folds a session's record with the one listing scan
]

[[modules]]
# claude_code uses claude_code_protocol for control and continuation reads.
# The protocol uses claude_code_session, claude_code_stream and claude_code_wire.
# The claude_code_* helpers never import claude_code.
# oauth -> oauth_exchange -> oauth_protocol, transport, provider_types stays inside providers.
# oauth_exchange reads the exchange settings from config.oauth_config.
# oauth -> oauth_chatgpt -> oauth_profile -> oauth_protocol stays inside providers.
# oauth_profile reads the exchange settings from config.oauth_config.
path = "agent6.providers"
depends_on = [
  "agent6",  # serverInfo.version on the claude_code MCP handshake
  "agent6.budget",
  "agent6.child_env",  # the claude_code child's curated environment
  "agent6.config.header_config",  # the extra_headers grammar the adapters render
  "agent6.config.oauth_config",  # the configured issuer a stored grant is bound to
  "agent6.config.secret_store",
  "agent6.config.surface_config",  # is_loopback_host: no ambient proxy carries a loopback bearer off the host
  "agent6.kinds",
  "agent6.media",
  "agent6.paths",
  "agent6.portable",
  "agent6.sandbox",  # die_with_parent ties the claude_code child to the agent
  "agent6.sessions.objects",
  "agent6.sessions.retention",
]

