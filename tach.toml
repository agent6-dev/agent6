path = "agent6.ui.steer"
depends_on = ["agent6.sessions.ipc"]

[[modules]]
# The /btw side ask every composer opens (CLI menu, TUI, web).
path = "agent6.ui.btw"
depends_on = ["agent6.app", "agent6.sandbox", "agent6.sessions.event_log", "agent6.sessions.layout", "agent6.ui.spawn"]

[[modules]]
# Find the agent6 exe and spawn it detached (new work / machines / background
# resume). Consumed by the CLI, the TUI, and the web server. Pure stdlib leaf.
path = "agent6.ui.spawn"
# The escapee sweep must not mistake a deliberately detached child (a `/btw`
# ask, a `/parallel` lane) for a jailed command's escapee and kill it.
# The one new-work spawn every hub makes: it parses the /parallel directive,
# validates its models, refuses a busy checkout, and locates the new session
# dir among the listing's.
depends_on = [
  "agent6.directive",
  "agent6.kinds",
  "agent6.models.validate",
  "agent6.paths",
  "agent6.sandbox",
  # a detached resume resolves the session it starts and reads its worker.pid
  # (the child owns the run once that pid is its own)
  "agent6.sessions.id",
  "agent6.sessions.layout",
  "agent6.sessions.lock",
  "agent6.sessions.process",
  "agent6.viewmodel",
]

[[modules]]
# Best-effort desktop notification via notify-send (fixed argv). Consumed by the
# CLI and the TUI. Pure stdlib leaf.
path = "agent6.ui.notify"
depends_on = []

[[modules]]
# The telemetry exporter: a journal reader beside the front-ends; it encodes the
