[[modules]]
path = "agent6.graph.ulid"
depends_on = []

[[modules]]
path = "agent6.sessions.id"
# The bucket layout: minting an id means checking the directory it would name,
# so the generator and the guard sit together rather than each caller spelling
# the path out. git_read: an explicit --session-id must be a valid git branch
# name (it becomes agent6/<id> and refs/agent6/<id>/head) before state creation.
depends_on = ["agent6.graph.ulid", "agent6.sessions.layout", "agent6.vcs.git_read", "agent6.words"]

