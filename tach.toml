# tach module map (see AGENTS.md): a red check means the map is stale,
# never that a change is forbidden.

exclude = [
  "**/.venv/**",
  "**/target/**",
  "**/tests/**",
]
source_roots = ["src"]
exact = true
forbid_circular_dependencies = true

[[modules]]
path = "agent6"
depends_on = []

[[modules]]
# Application pipelines composed over the engine, never a front-end and never
# importing agent6.ui: the run/resume lifecycle and the parallel fan-out /
# coordinator dispatch + candidate-ranking core. The front-end injects the
# presentation, process-spawn, and run-dir bridge callables it needs
# (see app/__init__.py: SessionFrontend, LaneRuntime).
# machine.check shares bundle, config and jail-PATH checks with create and the CLI.
# execution drains review_actions through sessions.ipc at the worker steer boundary.
# run and resume share session_runtime; execution, session_runtime and role_providers
