[[modules]]
# The shared view-model: a run's logs.jsonl folded into SessionState, a machine's
# journal folded into MachineState. Consumed by the TUI, the CLI watchers, and
# (later) the web UI. The machine fold reads the journal event types + the spec,
# so it depends on those two leaf machine modules; nothing UI-toolkit-shaped.
# machine_state uses machine_logs for execution probes; machine_watch reads
# machine_state views and machine_logs to advance the shared watch cursor.
# transcript delegates pending tools and verifications to transcript_items.
# transcript_items and transcript use transcript_text for previews and marker bodies.
# state and session_log share review's finding and disposition fold.
# comparison resolves group records through sessions.layout and sessions.manifest.
path = "agent6.viewmodel"
depends_on = [
  "agent6.budget",
  "agent6.config.io",
  "agent6.config.layer",
  "agent6.config.layer_data",
