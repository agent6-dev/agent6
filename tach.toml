    "agent6.config",
  "agent6.config.io",
  "agent6.config.layer",
  "agent6.config.layer_data",
  "agent6.config.layer_presets",
  "agent6.config.notices",
  "agent6.config.write",
  "agent6.errors",
  "agent6.kinds",  # the modes an operator starts, for the composer's routes
  "agent6.machine",
  # config-editor value suggestions: the one owner every editor and TAB
  # completion read
  "agent6.models.choices",
  "agent6.paths",
  "agent6.review_records",
  "agent6.sessions.ipc",
  "agent6.sessions.layout",
  # run_plan reads the session's mode from its manifest before spawning.
  "agent6.sessions.manifest",
  "agent6.sessions.process",
  "agent6.ui.directive_actions",
  "agent6.ui.spawn",
  "agent6.ui.telemetry",
  # One branch-tips snapshot per hub poll (the listing's unmerged mark).
  "agent6.vcs.git_diff",
  "agent6.vcs.git_files",
  "agent6.vcs.git_history",
  "agent6.vcs.git_read",
  "agent6.viewmodel",
  "agent6.viewmodel.receipt",
