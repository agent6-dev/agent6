# grammar stays identical to the directive spec.
path = "agent6.directive"
depends_on = []

[[modules]]
# MemoryStoreError subclasses OperatorError, so a store refusal presents as the
# operator's at the CLI boundary while the run loop keeps its degrade catches.
path = "agent6.context.memory"
depends_on = ["agent6.errors", "agent6.paths", "agent6.portable"]

