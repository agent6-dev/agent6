[[modules]]
# Curated model capabilities (context windows, compaction sizing, per-model
# prompting defaults); composes the live listing cache for windows the
# bundled table omits.
path = "agent6.models.registry"
# agent6.providers: the openai wire owns what an unset effort resolves to, so
# `config show` reads the rule rather than restating it.
depends_on = ["agent6.config", "agent6.kinds", "agent6.models.cache", "agent6.providers"]

[[modules]]
# Pre-spawn model validation + did-you-mean (configured roles + `/parallel`
# specs), shared by the three front-ends and the coordinator's group
# dispatcher. Cache-first matching via the registry's normalization; a miss
# re-fetches the live listing (secrets: the key for the authed fetch) so a
# refusal never rests on a stale snapshot.
path = "agent6.models.validate"
depends_on = ["agent6.config", "agent6.config.layer", "agent6.config.secret_store", "agent6.directive", "agent6.kinds", "agent6.models.cache", "agent6.models.registry"]

[[modules]]
# The values an open-text config leaf can take (a provider's model ids, the
# /parallel lane ids): one owner behind every editor's picker, the web suggest
# route, and TAB completion.
path = "agent6.models.choices"
# sessions.manifest: a resume row names the preset and model a run replays.
depends_on = ["agent6.config", "agent6.config.io", "agent6.config.layer", "agent6.config.layer_data", "agent6.config.layer_presets", "agent6.config.secret_store", "agent6.kinds", "agent6.models.cache", "agent6.models.validate", "agent6.sessions.manifest"]

