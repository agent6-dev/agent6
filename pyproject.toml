[tool.ruff.lint.per-file-ignores]
"bench/**" = ["ANN", "C90", "D", "DOC", "E501", "ERA", "ICN", "N", "PLC0415", "PLR0912", "PLR0915", "PLW2901", "PTH", "S", "SIM105", "SIM114", "SIM115"]
# Until a package's docstring and import passes land, its docstring, annotation and
# import-style rules stay off; each pass removes its own line.
# `*` crosses `/` here, so a package's own modules are listed by name.
"src/agent6/{__init__,budget,child_env,commit_message,directive,errors,events,git_ops,init,kinds,memory,paths,portable,secrets,skills,task_text,verify_infer}.py" = ["ANN", "D", "DOC", "ICN003"]
"src/agent6/_data/**" = ["ANN", "D", "DOC", "ICN003"]
"src/agent6/app/**" = ["ICN003"]
"src/agent6/config/**" = ["ICN003"]
"src/agent6/graph/**" = ["ICN003"]
"src/agent6/harness/**" = ["ICN003"]
"src/agent6/machine/**" = ["ICN003"]
"src/agent6/models/**" = ["ANN", "D", "DOC", "ICN003"]
"src/agent6/prompts/**" = ["ANN", "D", "DOC", "ICN003"]
"src/agent6/providers/**" = ["ANN", "D", "DOC", "ICN003"]
"src/agent6/sandbox/**" = ["ICN003"]
"src/agent6/sessions/**" = ["ICN003"]
"src/agent6/tools/**" = ["ICN003"]
"src/agent6/ui/{__init__,btw,directives,keymap,mcp_server,notify,spawn,steer}.py" = ["ANN", "D", "DOC", "ICN003"]
"src/agent6/ui/acp/**" = ["ICN003"]
"src/agent6/ui/cli/**" = ["ANN", "D", "DOC", "ICN003"]
"src/agent6/ui/tui/**" = ["ANN", "D", "DOC", "ICN003"]
"src/agent6/ui/web/**" = ["ICN003"]
"src/agent6/viewmodel/**" = ["ICN003"]
"docs/{gen_config,gen_contracts,gen_diagrams}.py" = ["ANN", "D", "DOC", "ICN003"]
"docs/screenshots/{build_fixtures,keystroke_overlay,llm_proxy,make_cover,seed,tui_snapshot,web_demo}.py" = ["ANN", "D", "DOC", "ICN003"]
# gen_contracts.py embeds the artifact's CSS/SVG/HTML as strings; line length is moot there.
"docs/gen_contracts.py" = ["E501"]
"docs/screenshots/keystroke_overlay.py" = ["PLR0912", "PLR1730"]
# web_demo.py embeds a block of cursor/animation JS as a string; line length is moot there.
"docs/screenshots/web_demo.py" = ["E501"]
"hatch_build.py" = ["ANN", "D", "DOC", "ICN003"]
# page.py composes embedded HTML asset strings; line length is meaningless there.
"src/agent6/ui/web/page.py" = ["E501"]
# A test module, class or function needs no docstring; one that has one names the regression.
"tests/**" = ["ANN", "B017", "D1", "D", "DOC", "ICN003", "PLC0415", "PLR0915", "PLR2004", "S"]

[tool.pyright]
include = ["docs/gen_contracts.py", "src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

# cli/ shares _-prefixed helpers across its modules as the package-internal
# API; the file-local private/unused checks only add noise here.
[[tool.pyright.executionEnvironments]]
root = "src/agent6/ui/cli"
reportPrivateUsage = false
reportUnusedFunction = false
reportUnusedClass = false

# The headless TUI tests poke internal seams (`_handle_event`, `_tick`) on
# purpose, so silence the private-usage check here only. The root also decides
# where an absolute import resolves from, so the tree itself stays on the path.
[[tool.pyright.executionEnvironments]]
root = "tests/tui"
extraPaths = ["."]
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# src layout: the suite tests the checkout, not an installed copy.
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config -n auto"
markers = [
    "needs_landlock_tcp: requires Linux >=6.7 (Landlock ABI v4)",
    "needs_namespaces: requires unprivileged user namespaces (skipped in restrictive sandboxes)",
    "needs_network: requires real Anthropic API key in ANTHROPIC_API_KEY",
]
