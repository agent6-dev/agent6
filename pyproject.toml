[project]
name = "agent6"
dynamic = ["version"]
description = "A coding agent that jails model commands and uses editable state machines for long-running tasks."
readme = "README.md"
urls = { "Documentation" = "https://agent6.dev", "Homepage" = "https://agent6.dev", "Source" = "https://github.com/agent6-dev/agent6" }
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Eric Lesiuta" }]
dependencies = [
    "argcomplete>=3,<4",
    "httpx2>=2.3,<3",
    "pydantic>=2.7,<3",
    "ruff>=0.6,<1",  # runtime, not dev: lints the scripts `machine create` generates
    "textual>=8,<9",
    "tree-sitter-language-pack==1.20.0",
    "tree-sitter==0.26.0",
    "ty>=0.0.46,<0.1",  # runtime: typechecks the scripts `machine create` generates
]

[project.scripts]
agent6 = "agent6.ui.cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agent6/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent6"]
# The jail binary is gitignored, so list it explicitly or hatchling drops it.
artifacts = ["src/agent6/sandbox/_bin/agent6-jail"]
# Ship the compiled binary, not the Rust crate it is built from.
exclude = ["src/agent6/jail"]

# Bundle the reference docs into the wheel (agent6/_docs/) for the
# agent6_docs tool.
[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "agent6/_docs/AGENTS.md"
"README.md" = "agent6/_docs/README.md"
"docs/acp.md" = "agent6/_docs/ACP.md"
"docs/architecture.md" = "agent6/_docs/ARCHITECTURE.md"
"docs/config.md" = "agent6/_docs/CONFIG.md"
"docs/installation.md" = "agent6/_docs/INSTALLATION.md"
"docs/security.md" = "agent6/_docs/SECURITY.md"
"docs/state-machines.md" = "agent6/_docs/STATE-MACHINES.md"
"docs/terminal.md" = "agent6/_docs/TERMINAL.md"
"docs/usage.md" = "agent6/_docs/USAGE.md"
"docs/web.md" = "agent6/_docs/WEB.md"

# Compile agent6-jail during the wheel build; without cargo the hook builds a
# pure-Python wheel (`agent6 check sandbox` explains the missing binary). CI
# sets AGENT6_JAIL_TARGET=x86_64-unknown-linux-musl for a static binary.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Rust crate sources ride the sdist so the jail can build from it; the binary
# and build dir stay out.
include = [
    "AGENTS.md",
    "LICENSE",
    "README.md",
    "docs/acp.md",
    "docs/architecture.md",
    "docs/config.md",
    "docs/installation.md",
    "docs/security.md",
    "docs/state-machines.md",
    "docs/terminal.md",
    "docs/usage.md",
    "docs/web.md",
    "hatch_build.py",
    "src/agent6",
    "tach.toml",
]
exclude = [
    "src/agent6/jail/target",
    "src/agent6/sandbox/_bin",
]

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pyan3>=2.6.2",
    "pyright>=1.1.380",
    "pytest-cov>=5",
    "pytest-xdist>=3.8.0",
    "pytest>=8",
    "ruff>=0.6,<1",
    "tach>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# bench task repos are agent-input fixtures (some deliberately buggy); demo
# seeds replay committed cassettes byte-exact. Lint must not touch either.
extend-exclude = ["bench/coreagent/tasks/*/repo", "docs/screenshots/seed"]

[tool.ruff.lint]
select = [
    "ANN",    # everything typed
    "B",      # bugbear
    "C90",    # complexity: the hard bound
    "D",      # docstrings in the Google shape
    "DOC201", # a Returns section where a value is returned
    "DOC402", # a Yields section where a value is yielded
    "DOC501", # a Raises section for what is raised
    "E",      # pycodestyle
    "ERA",    # no commented-out code
    "F",      # pyflakes
    "I",      # isort
    "ICN",    # import conventions: module-style imports
    "N",      # pep8-naming
    "PL",     # pylint subset
    "PTH",    # use pathlib
    "RUF",    # ruff-specific
    "S",      # bandit
    "SIM",    # simplify
    "TID",    # tidy imports
    "UP",     # pyupgrade
    "W",      # pycodestyle
]
# The DOC rules are preview rules, selected by their exact codes.
preview = true
explicit-preview-rules = true
ignore = [
    "ANN401",   # Any stays allowed at the boundaries that need it
    "D105",     # a magic method's docstring says nothing its name does not
    "D107",     # the class docstring carries the attributes; __init__ repeats it
    "PLR0913",  # too many args; fine in our typed APIs
    "PLR0917",  # same call, counted positionally
    "PLR2004",  # magic-value comparisons; noisy in tests
    "S101",     # asserts allowed
    "S603",     # subprocess: we audit every call site
    "S607",     # subprocess partial path: we use absolute paths
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.flake8-import-conventions]
# Members are never imported from these: `from agent6.pkg import module` and
# `module.name` at the call site (typing and collections.abc excepted). The
# agent6 entries are every leaf module of the tree, pinned by
