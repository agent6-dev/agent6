[project]
name = "agent6"
dynamic = ["version"]
description = "A coding agent that jails model commands and uses editable state machines for long-running tasks."
readme = "README.md"
urls = { "Documentation" = "https://agent6.dev", "Homepage" = "https://agent6.dev", "Source" = "https://github.com/agent6-dev/agent6" }
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Eric Lesiuta" }]
dependencies = [
    "argcomplete>=3,<4",
    "httpx2>=2.16.0,<3",
    "markdown-it-py==4.2.0",  # No trusted publishing; bump this pin by hand.
    "pydantic>=2.14.1,<3",
    "ruff>=0.17.1,<1",  # runtime, not dev: lints the scripts `machine create` generates
    "textual>=8,<9",
    "tree-sitter-language-pack==1.22.1",
    "tree-sitter==0.26.0",
    "ty>=0.0.90,<0.1",  # runtime: typechecks the scripts `machine create` generates
]

[project.scripts]
agent6 = "agent6.ui.cli.entry:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/agent6/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent6"]
# The jail binary is gitignored, so list it explicitly or hatchling drops it.
artifacts = ["src/agent6/sandbox/_bin/agent6-jail"]
# Ship the compiled binary, not the Rust crate it is built from.
exclude = ["src/agent6/jail"]

# Bundle the reference docs into the wheel (agent6/_docs/) for the
# agent6_docs tool.
[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "agent6/_docs/AGENTS.md"
"README.md" = "agent6/_docs/README.md"
"docs/acp.md" = "agent6/_docs/ACP.md"
"docs/architecture.md" = "agent6/_docs/ARCHITECTURE.md"
"docs/cli.md" = "agent6/_docs/CLI.md"
"docs/config.md" = "agent6/_docs/CONFIG.md"
"docs/formats.md" = "agent6/_docs/FORMATS.md"
"docs/installation.md" = "agent6/_docs/INSTALLATION.md"
"docs/security.md" = "agent6/_docs/SECURITY.md"
"docs/state-machines.md" = "agent6/_docs/STATE-MACHINES.md"
"docs/terminal.md" = "agent6/_docs/TERMINAL.md"
"docs/usage.md" = "agent6/_docs/USAGE.md"
"docs/web.md" = "agent6/_docs/WEB.md"

# Compile agent6-jail during the wheel build; without cargo the hook builds a
# pure-Python wheel (`agent6 check sandbox` explains the missing binary). CI
# sets AGENT6_JAIL_TARGET=x86_64-unknown-linux-musl for a static binary.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Rust crate sources ride the sdist so the jail can build from it; the binary
# and build dir stay out.
include = [
    "AGENTS.md",
    "LICENSE",
    "README.md",
    "docs/acp.md",
    "docs/architecture.md",
    "docs/config.md",
    "docs/formats.md",
    "docs/installation.md",
    "docs/security.md",
    "docs/state-machines.md",
    "docs/terminal.md",
    "docs/usage.md",
    "docs/web.md",
    "hatch_build.py",
    "src/agent6",
    "tach.toml",
]
exclude = [
    "src/agent6/jail/target",
    "src/agent6/sandbox/_bin",
]

[dependency-groups]
dev = [
    "jsonschema>=4",
    "playwright>=1.64.0",
    "pyan3>=2.9.0",
    "pyright>=1.1.414",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1,<1",
    "tach>=0.35.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# bench task repos are agent-input fixtures (some deliberately buggy); demo
# seeds replay committed cassettes byte-exact. Lint must not touch either.
extend-exclude = ["bench/coreagent/tasks/*/repo", "docs/screenshots/seed"]

[tool.ruff.lint]
select = [
    "ANN",    # everything typed
    "B",      # bugbear
    "C90",    # complexity: the hard bound
    "D",      # docstrings in the Google shape
    "D401",   # imperative summaries; the Google convention leaves this rule off
    "DOC201", # a Returns section where a value is returned
    "DOC402", # a Yields section where a value is yielded
    "DOC501", # a Raises section for what is raised
    "E",      # pycodestyle
    "ERA",    # no commented-out code
    "F",      # pyflakes
    "I",      # isort
    "ICN",    # import conventions: module-style imports
    "N",      # pep8-naming
    "PL",     # pylint subset
    "PTH",    # use pathlib
    "RUF",    # ruff-specific
    "S",      # bandit
    "SIM",    # simplify
    "TID",    # tidy imports
    "UP",     # pyupgrade
    "W",      # pycodestyle
]
# The DOC rules are preview rules, selected by their exact codes.
preview = true
explicit-preview-rules = true
ignore = [
    "ANN401",   # Any stays allowed at the boundaries that need it
    "D105",     # a magic method's docstring says nothing its name does not
    "D107",     # the class docstring carries the attributes; __init__ repeats it
    "ICN001",   # no alias convention applies; import datetime is module style
    "PLR0913",  # too many args; fine in our typed APIs
    "PLR0917",  # same call, counted positionally
    "PLR2004",  # magic-value comparisons; noisy in tests
    "S101",     # asserts allowed
    "S603",     # subprocess: we audit every call site
    "S607",     # subprocess partial path: we use absolute paths
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.flake8-import-conventions]
# Members are never imported from these external modules: `from pkg import module` and
# `module.name` at the call site (typing and collections.abc excepted). The repository's own
# leaf modules follow the same rule from the tree, enforced by tests/unit/test_import_style.py;
# a package's `__init__.py` marks its re-exports `# re-export`. A package whose submodules are
# imported (textual, importlib, unittest) is not listed: `from textual import widgets` is the
# module style, and the rule would refuse it.
banned-from = [
    "argcomplete.shell_integration",
    "argparse",
    "collections",
    "concurrent.futures",
    "contextlib",
    "dataclasses",
    "datetime",
    "email.utils",
    "functools",
    "http.client",
    "http.server",
    "io",
    "ipaddress",
    "itertools",
    "jsonschema",
    "math",
    "multiprocessing.synchronize",
    "pathlib",
    "pydantic",
    "pydantic_core",
    "rich.markup",
    "rich.text",
    "textual.app",
    "textual.binding",
    "textual.command",
    "textual.containers",
    "textual.css.query",
    "textual.geometry",
    "textual.message",
    "textual.screen",
    "textual.timer",
    "textual.widgets",
    "threading",
    "tree_sitter",
    "tree_sitter_language_pack",
    "types",
    "unittest.mock",
    "urllib.error",
    "urllib.parse",
    "urllib.request",
    "xonsh.built_ins",
    "xonsh.completers",
    "xonsh.completers.tools",
]

[tool.ruff.lint.per-file-ignores]
"bench/**" = ["ANN", "C90", "D", "DOC", "E501", "ERA", "ICN", "N", "PLC0415", "PLR0912", "PLR0915", "PLW2901", "PTH", "S", "SIM105", "SIM114", "SIM115"]
# `*` crosses `/` in a per-file pattern, so single modules are listed by name.
"docs/screenshots/{build_fixtures,keystroke_overlay,llm_proxy,make_cover,seed,tui_snapshot,web_demo}.py" = ["ANN", "D", "DOC", "ICN003"]
# gen_contracts.py embeds the artifact's CSS/SVG/HTML as strings; line length is moot there.
# The CLI dispatchers import their command modules lazily, so `--help` and completion
# start without the engine.
"src/agent6/ui/cli/entry.py" = ["PLC0415"]
"docs/gen_contracts.py" = ["E501"]
"docs/screenshots/keystroke_overlay.py" = ["PLR0912", "PLR1730"]
# web_demo.py embeds a block of cursor/animation JS as a string; line length is moot there.
"docs/screenshots/web_demo.py" = ["E501"]
"hatch_build.py" = ["ANN", "D", "DOC", "ICN003"]
# page.py composes embedded HTML asset strings; line length is meaningless there.
"src/agent6/ui/web/page.py" = ["E501"]
# A test docstring names the regression in the declarative mood; docstrings are optional.
"tests/**" = ["ANN", "B017", "D1", "D401", "DOC", "PLC0415", "PLR0915", "PLR2004", "S"]

[tool.pyright]
include = ["docs/gen_contracts.py", "docs/gen_formats.py", "src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

# cli/ shares sibling helpers across its modules as the package-internal
# API; the file-local private/unused checks only add noise here.
[[tool.pyright.executionEnvironments]]
root = "src/agent6/ui/cli"
reportPrivateUsage = false
reportUnusedFunction = false
reportUnusedClass = false

# Tests reach a module's internal seams (`_handle_event`, `_policy_spec`) by attribute
# on purpose, so the private-usage check is off for them. The root also decides where
# an absolute import resolves from, so the tree itself stays on the path.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# src layout: the suite tests the checkout, not an installed copy.
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config -n auto"
markers = [
    "browser: drives Playwright's Chromium; skipped when it is not installed (uv run playwright install chromium)",
    "collector: checks telemetry with otelcol-contrib or promtool; skipped when the required binary is not installed",
    "needs_dev_tty: requires a pseudo-terminal and the /dev/tty node, which the jail omits",
    "needs_grammar: requires a cached tree-sitter grammar, selected by language",
    "needs_landlock_tcp: requires Linux >=6.7 (Landlock ABI v4)",
    "needs_namespaces: requires unprivileged user namespaces (skipped in restrictive sandboxes)",
    "needs_network: requires real Anthropic API key in ANTHROPIC_API_KEY",
    "needs_pty: requires allocating a pseudo-terminal",
]
